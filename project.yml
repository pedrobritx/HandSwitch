name: HandSwitch
options:
  bundleIdPrefix: com.handswitch
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HandSwitch:
    type: application
    platform: macOS
    sources:
      - path: HandSwitch
    settings:
      base:
        PRODUCT_NAME: HandSwitch
        PRODUCT_BUNDLE_IDENTIFIER: com.handswitch.HandSwitch
        INFOPLIST_FILE: HandSwitch/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HandSwitch/Resources/HandSwitch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  HandSwitchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: HandSwitch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handswitch.HandSwitchTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HandSwitch:
    build:
      targets:
        HandSwitch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HandSwitchTests
