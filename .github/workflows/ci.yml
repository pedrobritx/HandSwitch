name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications | grep -i '^Xcode' || true

      - name: Select Xcode 26
        run: |
          # Prefer any Xcode 26.x the image provides; fall back to the default.
          latest="$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project HandSwitch.xcodeproj \
            -scheme HandSwitch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/build.log; then
              echo "::error::Build failed. Unique compiler diagnostics:"
              grep -E '^/.*: (error|warning): ' /tmp/build.log \
                | sed 's|.*/HandSwitch/HandSwitch/||' | sort -u | head -60
              exit 1
          fi

      - name: Test
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project HandSwitch.xcodeproj \
            -scheme HandSwitch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee /tmp/test.log; then
              echo "::error::Tests failed. Diagnostics and failing cases:"
              grep -E '^/.*: (error|warning): |failed|XCTAssert|Test Case .* failed' /tmp/test.log \
                | sed 's|.*/HandSwitch/||' | sort -u | head -60
              exit 1
          fi
