<?xml version="1.0" encoding="UTF-8"?>
<!--
  HandSwitch app icon — vector master (reference/source).
  The raster PNGs in Assets.xcassets/AppIcon.appiconset are generated by
  Tools/generate_appicon.py. Edit this shape and the script together.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#tileGradient)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#sheen)"/>

  <!-- Mouse body -->
  <rect x="372" y="306" width="280" height="428" rx="140" ry="140" fill="#FFFFFF"/>

  <!-- Button seam (shows the tile gradient through the body) -->
  <rect x="503" y="349" width="18" height="137" rx="9" ry="9" fill="url(#tileGradient)"/>

  <!-- Scroll wheel -->
  <rect x="492" y="368" width="40" height="52" rx="20" ry="20" fill="url(#tileGradient)"/>
</svg>
